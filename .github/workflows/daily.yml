name: Daily update
on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST; GitHub often starts scheduled runs hours late, the README shows the real time
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      # Fix round 1, findings 4 & 5: a cancelled/missed approve.yml run (concurrency group collision, runner
      # outage) is picked up here within a day. The sweep is idempotent: issues already applied in a prior
      # sweep are skipped (mergeApprovedRows), so re-running it here is always safe.
      - run: node scripts/approve-sweep.mjs prepare
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "data: daily update $(date -u +%F)"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main; then
                if git push; then pushed=1; break; fi
              else
                echo "rebase conflict against main, aborting"
                git rebase --abort || true
                exit 1
              fi
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then echo "push failed after 3 attempts"; exit 1; fi
          fi
      - name: Close and thank submitters whose rows were pushed by the sweep above
        run: node scripts/approve-sweep.mjs finalize
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
      # Fix round 2, finding 4: chooseDesk() (build-core.mjs) keeps yesterday's desk rows and sets
      # meta.desk_warning when the upstream deadline-desk feed failed or came back empty while we had rows
      # before — so the Deadline Desk section never silently empties, it just goes stale with a flag. This
      # runs AFTER the commit step above so a desk_warning never blocks the data from landing; it only turns
      # the already-green run into a visible failure so the existing health-issue step below fires.
      - name: Fail loudly if the desk feed needed a fallback
        run: |
          node -e "
            const meta = JSON.parse(require('fs').readFileSync('data/meta.json', 'utf8'));
            if (meta.desk_warning) {
              console.error('Deadline Desk warning: ' + meta.desk_warning);
              process.exit(1);
            }
          "
      - name: Close the health issue after a good run
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for n in $(gh issue list --label health --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: daily update succeeded on $(date -u +%F)."
          done
      # Fix round 2, finding 3: a run that hit the 30-minute job timeout is CANCELLED by GitHub, not FAILED —
      # `if: failure()` alone never caught that case, so a timed-out run left no health issue at all.
      - name: Open or update the health issue on failure or timeout
        if: failure() || cancelled()
        env: { GH_TOKEN: '${{ github.token }}', RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' }
        run: |
          gh label create health --color B60205 --description "Daily update problems" 2>/dev/null || true
          n=$(gh issue list --label health --state open --json number --jq '.[0].number')
          if [ "${{ job.status }}" = "cancelled" ]; then
            msg="Cancelled (likely timed out after 30 minutes) on $(date -u +%F): $RUN_URL"
          else
            msg="Failed again $(date -u +%F): $RUN_URL"
          fi
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"
          else gh issue create --label health --title "Daily update failed" --body "The daily update failed and nothing was written, so yesterday's list is still up. $msg"; fi
