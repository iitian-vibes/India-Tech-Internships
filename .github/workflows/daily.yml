name: Daily update
on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST; GitHub often starts scheduled runs hours late, the README shows the real time
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: npm run build
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/
          git diff --cached --quiet || { git commit -m "data: daily update $(date -u +%F)"; git push; }
      - name: Close the health issue after a good run
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for n in $(gh issue list --label health --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: daily update succeeded on $(date -u +%F)."
          done
      - name: Open or update the health issue on failure
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}', RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' }
        run: |
          gh label create health --color B60205 --description "Daily update problems" 2>/dev/null || true
          n=$(gh issue list --label health --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "Failed again $(date -u +%F): $RUN_URL"
          else gh issue create --label health --title "Daily update failed" --body "The daily update failed and nothing was written, so yesterday's list is still up. Run: $RUN_URL"; fi
