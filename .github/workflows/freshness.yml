name: Freshness check
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writer
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ssh-key: '${{ secrets.BOT_DEPLOY_KEY }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/freshness.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: freshness banner"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main; then
                if git push; then pushed=1; break; fi
              else
                echo "rebase conflict against main, aborting"
                git rebase --abort || true
                exit 1
              fi
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then echo "push failed after 3 attempts"; exit 1; fi
          fi
